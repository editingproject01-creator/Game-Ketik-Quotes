<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Game Quotes</title>
</head>
<body>
    
    <div class="timer" id="timer">0</div>
    <div class="container">
        <div class="quote-display" id="quoteDisplay"></div>
        <textarea 
            class="quote-input" 
            id="quoteInput" 
            autofocus 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="off" 
            spellcheck="false"></textarea>
        <!-- Tombol Next Tambahan -->
        <button class="next-btn" id="nextBtn">Next &rarr;</button>
    </div>

    <div class="footer">
        <h4>© 2026 Luqman.ID</h4>
    </div>

</body>
</html>
